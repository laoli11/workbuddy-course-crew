<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent;
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif; }
  .stage { position:absolute; inset:0; }

  .bg { position:absolute; inset:0; background:
    radial-gradient(1300px 750px at 50% 36%, rgba(56,110,246,0.30), transparent 62%),
    radial-gradient(900px 620px at 50% 104%, rgba(168,85,247,0.22), transparent 60%),
    radial-gradient(620px 420px at 16% 18%, rgba(34,211,238,0.12), transparent 60%),
    radial-gradient(520px 360px at 86% 30%, rgba(99,102,241,0.12), transparent 60%),
    linear-gradient(180deg, #04060d 0%, #0a1122 52%, #070b18 100%); }
  .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%); }

  .dot { position:absolute; border-radius:50%; }
  #flowLayer { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }

  /* 发光连接线 */
  .lines { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; }
  .lines line { stroke-linecap:round; }

  /* 中心 WorkBuddy 发光方块 */
  .core { position:absolute; left:865px; top:265px; width:190px; height:190px; border-radius:36px;
    background:linear-gradient(135deg, #38bdf8 0%, #6366f1 55%, #a855f7 100%);
    box-shadow:0 0 60px rgba(56,189,248,0.6), 0 0 120px rgba(99,102,241,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center; }
  .core .logo { font-size:64px; font-weight:800; letter-spacing:2px; color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,0.8); }
  .core .ring1 { position:absolute; inset:-26px; border-radius:46px; border:2px solid rgba(125,211,252,0.35); }
  .core .ring2 { position:absolute; inset:-52px; border-radius:58px; border:1.5px dashed rgba(125,211,252,0.25); }

  /* 四周节点 */
  .node { position:absolute; display:flex; align-items:center; gap:14px; padding:14px 26px; border-radius:18px;
    border:1px solid rgba(140,170,220,0.28); background:linear-gradient(180deg, rgba(120,150,210,0.18), rgba(90,110,170,0.08));
    box-shadow:0 14px 34px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.10); }
  .node .nic { width:46px; height:46px; border-radius:13px; flex:none;
    display:flex; align-items:center; justify-content:center; }
  .node .nic svg { width:26px; height:26px; }
  .node .ntx { font-size:30px; font-weight:700; color:#eaf2ff; letter-spacing:3px; }
  .node .nsu { font-size:18px; letter-spacing:2px; color:#9fb4d6; opacity:0.7; margin-top:2px; }

  /* 下载即用 · 免费积分 徽章 */
  .badge { position:absolute; left:50%; top:600px; transform:translateX(-50%); display:flex; align-items:center; gap:18px;
    padding:16px 44px; border-radius:46px; white-space:nowrap;
    background:linear-gradient(100deg, rgba(56,189,248,0.18), rgba(168,85,247,0.16));
    border:1px solid rgba(125,211,252,0.4);
    box-shadow:0 0 34px rgba(56,189,248,0.35), inset 0 1px 0 rgba(255,255,255,0.12); }
  .badge .b1 { font-size:38px; font-weight:800; letter-spacing:5px;
    background:linear-gradient(100deg,#38bdf8,#a5f3fc); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(56,189,248,0.5)); }
  .badge .sep { width:2px; height:38px; background:rgba(125,211,252,0.4); }
  .badge .b2 { font-size:38px; font-weight:800; letter-spacing:5px;
    background:linear-gradient(100deg,#fbbf24,#fde68a); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(251,191,36,0.5)); }

  /* 标题 */
  .title { position:absolute; left:50%; top:690px; transform:translateX(-50%);
    text-align:center; white-space:nowrap; padding:10px 30px; overflow:hidden; line-height:1.15; }
  .title .pre { font-size:70px; font-weight:600; color:#c6d6ee; letter-spacing:10px;
    text-shadow:0 0 24px rgba(56,189,248,0.35); }
  .title .hl { font-size:92px; font-weight:800; letter-spacing:12px; margin-left:6px;
    background:linear-gradient(100deg, #38bdf8 0%, #a5f3fc 38%, #fbbf24 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(56,189,248,0.45)) drop-shadow(0 0 30px rgba(251,191,36,0.25)); }
  .sweep { position:absolute; top:0; bottom:0; width:220px; transform:skewX(-18deg);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div id="particles"></div>
  <div class="vignette"></div>

  <svg class="lines" id="lines" viewBox="0 0 1920 1080">
    <defs>
      <filter id="lglow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <line id="lnMail"   x1="640" y1="360" x2="960" y2="360" stroke="#38bdf8" stroke-width="5" filter="url(#lglow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <line id="lnFeishu" x1="800" y1="185" x2="960" y2="360" stroke="#6366f1" stroke-width="5" filter="url(#lglow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <line id="lnWecom"  x1="1120" y1="185" x2="960" y2="360" stroke="#34d399" stroke-width="5" filter="url(#lglow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <line id="lnExcel"  x1="1280" y1="360" x2="960" y2="360" stroke="#22c55e" stroke-width="5" filter="url(#lglow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <line id="lnInfo"   x1="960" y1="541" x2="960" y2="360" stroke="#f59e0b" stroke-width="5" filter="url(#lglow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  </svg>

  <div id="flowLayer"></div>

  <div class="core" id="core">
    <div class="logo">WB</div>
    <div class="ring1" id="ring1"></div>
    <div class="ring2" id="ring2"></div>
  </div>

  <div class="node" id="nodeMail" style="left:550px; top:324px;">
    <div class="nic" style="background:linear-gradient(135deg,#38bdf8,#6366f1); box-shadow:0 0 16px rgba(56,189,248,0.5);"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
    <div><div class="ntx">邮件</div><div class="nsu">收发 · 跟进</div></div>
  </div>
  <div class="node" id="nodeFeishu" style="left:710px; top:149px;">
    <div class="nic" style="background:linear-gradient(135deg,#6366f1,#a855f7); box-shadow:0 0 16px rgba(99,102,241,0.5);"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l18-8-8 18-3-7-7-3z"/></svg></div>
    <div><div class="ntx">飞书</div><div class="nsu">消息 · 协同</div></div>
  </div>
  <div class="node" id="nodeWecom" style="left:1030px; top:149px;">
    <div class="nic" style="background:linear-gradient(135deg,#34d399,#10b981); box-shadow:0 0 16px rgba(52,211,153,0.5);"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8 8H4l2.5-3A8 8 0 1121 12z"/><circle cx="9" cy="12" r="1.4" fill="#0b1224" stroke="none"/><circle cx="14" cy="12" r="1.4" fill="#0b1224" stroke="none"/></svg></div>
    <div><div class="ntx">企业微信</div><div class="nsu">群聊 · 审批</div></div>
  </div>
  <div class="node" id="nodeExcel" style="left:1190px; top:324px;">
    <div class="nic" style="background:linear-gradient(135deg,#22c55e,#16a34a); box-shadow:0 0 16px rgba(34,197,94,0.5);"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></svg></div>
    <div><div class="ntx">Excel</div><div class="nsu">表格 · 统计</div></div>
  </div>
  <div class="node" id="nodeInfo" style="left:870px; top:509px;">
    <div class="nic" style="background:linear-gradient(135deg,#f59e0b,#f43f5e); box-shadow:0 0 16px rgba(245,158,11,0.5);"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>
    <div><div class="ntx">企业信息</div><div class="nsu">数据 · 对接</div></div>
  </div>

  <div class="badge" id="badge">
    <span class="b1">下载即用</span><span class="sep"></span><span class="b2">免费积分</span>
  </div>

  <div class="title" id="title">
    <span class="pre">腾讯生态打通 + </span><span class="hl">下载即用 · 免费积分</span>
    <div class="sweep" id="sweep"></div>
  </div>
</div>

<script>
  const W = 1920, H = 1080;
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function easeOutBack(x){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }
  function seg(t, a, b){ return clamp01((t - a) / (b - a)); }
  function mix(a, b, k){ return a + (b - a) * k; }
  function wrap(v, m){ v = v % m; if (v < 0) v += m; return v; }

  const core = document.getElementById('core');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');
  const badge = document.getElementById('badge');
  const title = document.getElementById('title');
  const sweep = document.getElementById('sweep');

  // 节点：home 中心坐标 + 飞行起始偏移
  const nodes = [
    { el: document.getElementById('nodeMail'),   hx: 640,  hy: 360,  fx: -220, fy: 0,   t0: 0.5 },
    { el: document.getElementById('nodeFeishu'), hx: 800,  hy: 185,  fx: -180, fy: -180, t0: 0.9 },
    { el: document.getElementById('nodeWecom'),  hx: 1120, hy: 185,  fx: 180,  fy: -180, t0: 1.3 },
    { el: document.getElementById('nodeExcel'),  hx: 1280, hy: 360,  fx: 220,  fy: 0,   t0: 1.7 },
    { el: document.getElementById('nodeInfo'),   hx: 960,  hy: 541,  fx: 0,    fy: 220, t0: 2.1 },
  ];
  const lines = [
    { el: document.getElementById('lnMail'),   t0: 0.9 },
    { el: document.getElementById('lnFeishu'), t0: 1.3 },
    { el: document.getElementById('lnWecom'),  t0: 1.7 },
    { el: document.getElementById('lnExcel'),  t0: 2.1 },
    { el: document.getElementById('lnInfo'),   t0: 2.5 },
  ];

  // 漂浮粒子
  const P = 54;
  const parts = [];
  const pc = document.getElementById('particles');
  const pCols = ['#7dd3fc', '#93c5fd', '#c4b5fd', '#6ee7b7'];
  for (let i = 0; i < P; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const sz = 2 + (i % 4) * 1.7;
    const col = pCols[i % 4];
    d.style.width = d.style.height = sz + 'px';
    d.style.background = col;
    d.style.boxShadow = '0 0 ' + (6 + sz) + 'px ' + col;
    pc.appendChild(d);
    parts.push({ el: d, px: (i * 137.5) % W, py: (i * 211.3) % 800,
      a: (i % 7) * 0.9, sp: 0.3 + (i % 5) * 0.12, amp: 8 + (i % 6) * 6,
      rise: 8 + (i % 4) * 7, o: 0.22 + (i % 5) * 0.1 });
  }

  // 数据流动粒子（沿每条线向中心流动）
  const flow = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = 0; j < 3; j++) {
      flow.push({ line: i, off: j / 3, sp: 0.5 + (j % 3) * 0.12, col: ['#38bdf8','#6366f1','#34d399','#22c55e','#f59e0b'][i] });
    }
  }
  // 每条线端点（home 中心 → 中心 960,360）
  function flowPos(f, k) {
    const n = nodes[f.line];
    const x = mix(n.hx, 960, k);
    const y = mix(n.hy, 360, k);
    return { x, y };
  }
  // 流动粒子 DOM
  const flowEls = flow.map(f => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.width = d.style.height = '9px';
    d.style.background = f.col;
    d.style.boxShadow = '0 0 12px ' + f.col;
    document.getElementById('flowLayer').appendChild(d);
    return d;
  });

  window.film = {
    duration: 8,
    frame(t) {
      // 漂浮粒子
      for (let i = 0; i < P; i++) {
        const p = parts[i];
        const y = wrap(p.py + Math.sin(t * p.sp + p.a) * p.amp - t * p.rise, 800);
        const x = wrap(p.px + Math.cos(t * p.sp * 0.8 + p.a) * p.amp * 0.5, W);
        p.el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        p.el.style.opacity = p.o * (0.7 + 0.3 * Math.sin(t * 0.5 + p.a));
      }

      // 中心方块：进场 + 呼吸
      const cIn = easeOutBack(clamp01(seg(t, 0.1, 0.9)));
      const breath = 1 + Math.sin((t - 0.9) * 2.0) * 0.03;
      core.style.opacity = seg(t, 0.1, 0.35);
      core.style.transform = 'scale(' + (cIn < 1 ? cIn : breath) + ')';
      ring1.style.opacity = 0.4 + 0.25 * Math.sin(t * 1.4);
      ring1.style.transform = 'scale(' + (1 + 0.05 * Math.sin(t * 1.4)) + ')';
      ring2.style.opacity = 0.4 + 0.2 * Math.sin(t * 1.4 + 1.5);
      ring2.style.transform = 'rotate(' + (t * 12) + 'deg) scale(' + (1 + 0.04 * Math.sin(t * 1.4 + 1.5)) + ')';

      // 节点飞入（错峰）
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const k = easeOutBack(clamp01(seg(t, n.t0, n.t0 + 0.8)));
        const o = easeOutCubic(clamp01(seg(t, n.t0, n.t0 + 0.4)));
        n.el.style.opacity = o;
        n.el.style.transform = 'translate(' + (n.fx * (1 - k)) + 'px,' + (n.fy * (1 - k)) + 'px) scale(' + k + ')';
      }

      // 连接线画入
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        const k = easeOutCubic(clamp01(seg(t, l.t0, l.t0 + 0.7)));
        l.el.style.strokeDashoffset = 1 - k;
      }

      // 数据流动粒子
      for (let i = 0; i < flow.length; i++) {
        const f = flow[i];
        const lineT0 = lines[f.line].t0;
        const k = wrap((t - lineT0) * f.sp + f.off, 1);
        const p = flowPos(f, k);
        flowEls[i].style.transform = 'translate(' + (p.x - 4.5) + 'px,' + (p.y - 4.5) + 'px)';
        flowEls[i].style.opacity = (t < lineT0) ? 0 : (0.2 + 0.8 * (1 - Math.abs(k - 0.5) * 2));
      }

      // 徽章：弹性叠加
      const bIn = easeOutBack(clamp01(seg(t, 4.2, 5.1)));
      badge.style.opacity = seg(t, 4.2, 4.5);
      badge.style.transform = 'translateX(-50%) translateY(' + ((1 - bIn) * 30) + 'px) scale(' + bIn + ')';
      badge.style.boxShadow = '0 0 ' + (34 + 10 * Math.sin((t - 5.1) * 2.4)) + 'px rgba(56,189,248,0.35), inset 0 1px 0 rgba(255,255,255,0.12)';

      // 标题浮现 + 扫光
      const tiIn = easeOutCubic(seg(t, 5.6, 6.9));
      title.style.opacity = tiIn;
      title.style.transform = 'translateX(-50%) translateY(' + ((1 - tiIn) * 26) + 'px)';
      const sw = seg(t, 6.7, 7.9);
      sweep.style.left = mix(-260, title.offsetWidth + 60, sw) + 'px';
      sweep.style.opacity = sw < 0.02 || sw > 0.98 ? 0 : 1;
    }
  };
</script>
</body>
</html>
